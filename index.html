        RAK_DATA[i] = {
            "5.1.02.01.01.0024": {"t": 10000000, "1": 2500000, "2": 2500000, "3": 2500000, "4": 2500000},

   function getSchoolNumber(name) {
    if (!name) return null;
    const m = name.match(/\b(\d+)\b/);
    return m ? m[1] : null;
}

function extractRekening(kodeRaw) {
    if (!kodeRaw) return '';
    const s = String(kodeRaw).trim();
    const idx = s.lastIndexOf('5.1.');
    return idx >= 0 ? s.slice(idx) : s;
}

    function getNominalPerTwMap(s) {
        if (s && s.nominalPerTw && typeof s.nominalPerTw === 'object' && Object.keys(s.nominalPerTw).length > 0) {
            const map = {};
            Object.keys(s.nominalPerTw).forEach(tw => { map[tw] = Number(s.nominalPerTw[tw]) || 0; });
            return map;
        }
        const tags = (s && s.triwulan ? String(s.triwulan).split(' & ') : []).map(t => t.trim()).filter(Boolean);
        const nominal = Number(s && s.nominal) || 0;
        if (tags.length === 0) return {};
        const rata = nominal / tags.length;
        const map = {};
        tags.forEach(t => { map[t] = rata; });
        return map;
    }

    function getPaguInfo(sekolah, rincian, triwulan) {
        const num = getSchoolNumber(sekolah);
        if (!num || !RAK_DATA[num]) return null;
        const kode = rincian.split(' ')[0];
        if (!RAK_DATA[num][kode]) return null;
        const twArr = Array.isArray(triwulan) ? triwulan : [triwulan];
        const totalTwPagu = twArr.reduce((acc, twStr) => {
            const twNum = twStr ? twStr.replace('Triwulan ', '') : '1';
            return acc + (RAK_DATA[num][kode][twNum] || 0);
        }, 0);
        return {
            total: RAK_DATA[num][kode]['t'] || 0,
            triwulan: totalTwPagu,
            kode: kode
        };
    }

    window.rakDataGlobal = [];

    function getPaguInfoEnhanced(sekolah, rincian, triwulan) {
        const fromOriginal = getPaguInfo(sekolah, rincian, triwulan);
        if (fromOriginal) return fromOriginal;
        if (!window.rakDataGlobal || window.rakDataGlobal.length === 0) return null;
        const num = getSchoolNumber(sekolah);
        if (!num) return null;
        const schoolData = window.rakDataGlobal.find(s => String(s.no) === String(num));
        if (!schoolData) return null;
        const kode = rincian.split(' ')[0];
        const rincianItem = schoolData.rincian.find(r => {
            const rKode = r.kode || '';
            const rSuffix = rKode.replace('5.1.02.01.01.', '').replace(/^0+/, '');
            const kSuffix = kode.replace('5.1.02.01.01.', '').replace(/^0+/, '');
            return rKode === kode || rSuffix === kSuffix;
        });
        if (!rincianItem) return null;
        const twArr = Array.isArray(triwulan) ? triwulan : [triwulan];
        const totalTwPagu = twArr.reduce((acc, twStr) => {
            const twNum = twStr ? twStr.replace('Triwulan ', '') : '1';
            const twKey = `tw${twNum}`;
            return acc + (rincianItem[twKey] || 0);
        }, 0);
        return {
            total: rincianItem.paguTotal || 0,
            triwulan: totalTwPagu,
            kode: kode
        };
    }

    function autoSplitNominalPerTw(sekolah, rincian, twArr, totalNominal, dataSpjList) {
        if (!sekolah || !rincian || !twArr || twArr.length === 0) return {};
        const kodeBelanja = rincian.split(' ')[0];
        const myNum = getSchoolNumber(sekolah);
        const spjRelevan = (dataSpjList || []).filter(s => {
            const sNum = s.sekolah ? s.sekolah.match(/\b(\d+)\b/)?.[1] : null;
            const sKode = s.rincian ? s.rincian.split(' ')[0] : '';
            const statusValid = (s.status === 'Menunggu Verifikasi' || s.status === 'Siap Cair' || s.status === 'Revisi' || s.status === 'Ditunda' || s.status === 'Sudah Cair');
            return sNum === myNum && sKode === kodeBelanja && statusValid;
        });
        const twUrut = [...twArr].sort();
        let sisaAlokasi = Number(totalNominal) || 0;
        const hasil = {};
        twUrut.forEach(tw => {
            const paguInfoTw = getPaguInfoEnhanced(sekolah, rincian, [tw]);
            const paguTw = paguInfoTw ? paguInfoTw.triwulan : 0;
            const sudahDiajukanTw = spjRelevan.reduce((acc, s) => acc + (Number(getNominalPerTwMap(s)[tw]) || 0), 0);
            const sisaTw = Math.max(0, paguTw - sudahDiajukanTw);
            const alokasi = Math.min(sisaAlokasi, sisaTw);
            if (alokasi > 0) hasil[tw] = alokasi;
            sisaAlokasi -= alokasi;
        });
        if (sisaAlokasi > 0) {
            const twTerakhir = twUrut[twUrut.length - 1];
            hasil[twTerakhir] = (hasil[twTerakhir] || 0) + sisaAlokasi;
        }
        return hasil;
    }

        const SisaSetelahPengajuan = ({ sekolah, rincian, triwulan, nominalInput, dataSpj }) => {

                return sNum === myNum && sKode === kodeBelanja && statusValid;

            const totalSudahDiajukan = twArr.reduce((acc, tw) => acc + spjRelevan.reduce((a, s) => a + (Number(getNominalPerTwMap(s)[tw]) || 0), 0), 0);

          const parseNominalFleksibel = (v) => {
            if (v === null || v === undefined) return 0;
            if (typeof v === 'number') return Math.round(v);
            let s = String(v).trim();
            s = s.replace(/,\d+$/, '');
            const digits = s.replace(/[^\d]/g, '');
            return digits ? parseInt(digits, 10) : 0;
          };
          const ekstrakNomorSekolah = (s) => {
            const m = String(s || '').match(/\d+/);

          const ekstrak4DigitKode = (s) => {
            const digits = String(s || '').replace(/[^\d]/g, '');

          const cocokkanDanCeklis = (baris) => {
            if (!baris.length) { alert('Tidak ada baris data valid (Nama Sekolah + Nilai Ajuan) yang terbaca dari file ini.'); return; }
            setLastUploadBaris(baris);

            const kandidat = dataSpj.filter(s => s.status === 'Siap Cair').map(s => ({
              spj: s,
              sekolahNum: ekstrakNomorSekolah(s.sekolah),
              nominal: Number(s.nominal) || 0,
              kode4: ekstrak4DigitKode(String(s.rincian || '').split(' ')[0]),
              rincianText: String(s.rincian || '').toLowerCase(),
            }));

            const kandidatSemua = dataSpj.map(s => ({
              spj: s,
              sekolahNum: ekstrakNomorSekolah(s.sekolah),
              nominal: Number(s.nominal) || 0,
            }));

            const sudahDipakai = new Set();
            const matched = [];
            const notFound = [];
            const ambiguous = [];
            const belanjaBeda = [];

            baris.forEach(b => {
              let opsi = kandidat.filter(k =>
                k.sekolahNum === b.sekolahNum && k.nominal === b.nominal && !sudahDipakai.has(k.spj.id)
              );
              if (b.kode4) {
                opsi = opsi.filter(k => k.kode4 === b.kode4);
              }
              if (opsi.length > 1 && b.belanja) {
                const belanjaNorm = b.belanja.toLowerCase();
                const opsiSempit = opsi.filter(k => k.rincianText && (belanjaNorm.includes(k.rincianText) || k.rincianText.includes(belanjaNorm)));
                if (opsiSempit.length >= 1) opsi = opsiSempit;
              }
              if (opsi.length === 1) {
                sudahDipakai.add(opsi[0].spj.id);
                matched.push(opsi[0].spj.id);
                if (b.belanja) {
                  const belanjaNorm = b.belanja.toLowerCase();
                  const rt = opsi[0].rincianText;
                  const cocokTeks = rt && (belanjaNorm.includes(rt) || rt.includes(belanjaNorm));
                  if (!cocokTeks) {
                    belanjaBeda.push({ spjId: opsi[0].spj.id, sekolahRaw: b.sekolahRaw, nominal: b.nominal, belanjaFile: b.belanja, rincianSistem: opsi[0].spj.rincian });
                  }
                }
              } else if (opsi.length === 0) {
                const lain = kandidatSemua.find(k => k.sekolahNum === b.sekolahNum && k.nominal === b.nominal);
                let statusLain = null;
                let spjIdLain = null;
                if (lain) {
                  spjIdLain = lain.spj.id;
                  if (lain.spj.status === 'Siap Cair' && sudahDipakai.has(lain.spj.id)) {
                    statusLain = 'DUPLIKAT_DI_FILE';
                  } else {
                    statusLain = lain.spj.status === 'Sudah Cair' && lain.spj.gu
                      ? `Sudah Cair (${lain.spj.gu})`
                      : lain.spj.status;
                  }
                }
                notFound.push({ sekolahRaw: b.sekolahRaw, nominal: b.nominal, statusLain, spjIdLain });
              } else {
                ambiguous.push({ sekolahRaw: b.sekolahRaw, nominal: b.nominal, jumlahOpsi: opsi.length });
              }
            });

            const updated = {};
            matched.forEach(id => { updated[id] = true; });
            setSelectedForCair(updated);
            setGuUploadResult({ matched: matched.length, notFound, ambiguous, belanjaBeda, totalRow: baris.length });
          };

          const refreshHasilUpload = () => {

          const [prosesVerifikasiMassal, setProsesVerifikasiMassal] = useState(false);
          const verifikasiMassal = async (items, statusAsal) => {
            const idList = [...new Set(items.map(n => n.spjIdLain).filter(Boolean))];
            if (!idList.length) return;
            const konfirmasi = window.confirm(
              `Anda akan mengubah ${idList.length} SPJ berstatus "${statusAsal}" menjadi "Siap Cair" SEKALIGUS.\n\nLanjutkan?`

            try {

                idsBerhasil.push(id);

              alert(`${idsBerhasil.length} SPJ berhasil dipindah ke Siap Cair.`);

          const handleUploadGuExcel = (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const namaFile = file.name.toLowerCase();
            const isPdf = namaFile.endsWith('.pdf');

            if (isPdf) {
              if (!window.pdfjsLib) { alert('Modul pembaca PDF belum siap, coba lagi sebentar lagi.'); e.target.value = ''; return; }
              const reader = new FileReader();
              reader.onload = async (evt) => {
                try {
                  const pdf = await pdfjsLib.getDocument({ data: evt.target.result }).promise;
                  const semuaBaris = [];
                  for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    const potongan = content.items
                      .filter(it => it.str && it.str.trim())
                      .map(it => ({ str: it.str.trim(), x: it.transform[4], y: it.transform[5] }));
                    potongan.sort((a, b) => b.y - a.y || a.x - b.x);
                    const TOLERANSI_Y = 4;
                    let barisSaatIni = null;
                    let yTerakhirDiBaris = null;
                    potongan.forEach(p => {
                      if (barisSaatIni && Math.abs(yTerakhirDiBaris - p.y) <= TOLERANSI_Y) {
                        barisSaatIni.items.push(p);
                        yTerakhirDiBaris = p.y;
                      } else {
                        barisSaatIni = { y: p.y, items: [p] };
                        semuaBaris.push(barisSaatIni);
                        yTerakhirDiBaris = p.y;
                      }
                    });
                  }
                  const teksBaris = semuaBaris.map(b => b.items.sort((a, c) => a.x - c.x).map(p => p.str).join(' '));

                  const rowRegex = new RegExp(
                    '^\\d+\\s+((?:UPT\\s+)?(?:SD|SMP|SMA|SMK|TK|PAUD|SLB)[A-Za-z.]*\\s*(?:NEGERI\\s*)?\\d+)\\s+GRESIK\\s+.*?(?:Rp\\s?)?([\\d]{1,3}(?:\\.\\d{3})*,\\d{2}|[\\d]{1,3}(?:\\.\\d{3})+|\\d+)\\s*(?:(\\d{2}\\.\\d{3}\\.\\d{5})\\s+)?(.*)$',
                    'i'
                  );
                  const baris = [];
                  teksBaris.forEach(line => {
                    const m = line.match(rowRegex);
                    if (!m) return;
                    const sekolahRaw = m[1].trim();
                    const belanjaGabung = m[3] ? (m[3] + ' ' + m[4]).trim() : m[4].trim();
                    baris.push({
                      sekolahNum: ekstrakNomorSekolah(sekolahRaw),
                      sekolahRaw,
                      nominal: parseNominalFleksibel(m[2]),
                      kode4: '',
                      belanja: belanjaGabung,
                    });
                  });
                  cocokkanDanCeklis(baris.filter(b => b.sekolahNum && b.nominal > 0));
                } catch (err) {
                  console.error(err);
                  alert('Gagal membaca file PDF: ' + err.message);
                } finally {
                  e.target.value = '';
                }
              };
              reader.readAsArrayBuffer(file);
              return;
            }

            const reader = new FileReader();
            reader.onload = (evt) => {
              try {
                const wb = XLSX.read(evt.target.result, { type: 'array' });
                const cariKolom = (headers, keywords) => headers.findIndex(h => keywords.some(k => String(h).toLowerCase().includes(k)));
                const MAKS_BARIS_SCAN_HEADER = 10;

                let hasilTerbaik = null;
                for (const sheetName of wb.SheetNames) {
                  const sheet = wb.Sheets[sheetName];
                  const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', blankrows: false });
                  const batasScan = Math.min(MAKS_BARIS_SCAN_HEADER, aoa.length);
                  for (let i = 0; i < batasScan; i++) {
                    const baris = aoa[i].map(c => String(c || ''));
                    const idxSekolah = cariKolom(baris, ['nama sekolah', 'sekolah']);
                    const idxNominal = cariKolom(baris, ['nilai ajuan', 'nominal', 'nilai']);
                    if (idxSekolah !== -1 && idxNominal !== -1) {
                      const idxKode = cariKolom(baris, ['kode belanja']);
                      const jumlahBarisData = aoa.length - (i + 1);
                      if (!hasilTerbaik || jumlahBarisData > hasilTerbaik.jumlahBarisData) {
                        hasilTerbaik = { sheetName, idxSekolah, idxNominal, idxKode, headerRowIdx: i, aoa, jumlahBarisData };
                      }
                      break;
                    }
                  }
                }

                if (!hasilTerbaik) {
                  alert('Tidak menemukan kolom "Nama Sekolah" dan/atau "Nilai Ajuan" di file ini.');
                  return;
                }

                const { aoa, idxSekolah, idxNominal, idxKode, headerRowIdx } = hasilTerbaik;
                const dataRows = aoa.slice(headerRowIdx + 1);

                const baris = dataRows
                  .map(r => ({
                    sekolahNum: ekstrakNomorSekolah(r[idxSekolah]),
                    sekolahRaw: String(r[idxSekolah] || '').trim(),
                    nominal: parseNominalFleksibel(r[idxNominal]),
                    kode4: idxKode !== -1 ? ekstrak4DigitKode(r[idxKode]) : '',
                  }))
                  .filter(b => b.sekolahNum && b.nominal > 0);

                cocokkanDanCeklis(baris);
              } catch (err) {
                console.error(err);
                alert('Gagal membaca file: ' + err.message);
              } finally {
                e.target.value = '';
              }
            };
            reader.readAsArrayBuffer(file);

          const STATUS_KE_TAB = {

            const tujuanTab = STATUS_KE_TAB[item.statusLain];

            list.forEach(n => {

              else if (n.statusLain === 'Revisi') grup.revisi.push(n);
              else if (n.statusLain === 'Ditunda') grup.ditunda.push(n);
              else if (n.statusLain === 'Menunggu Verifikasi') grup.verifikasi.push(n);
              else grup.tidakDitemukan.push(n);

                const noSpj = s.sekolah?.match(/\b(\d+)\b/)?.[1];
                return noRak && noSpj && noRak === noSpj &&
                  (s.status === 'Menunggu Verifikasi' || s.status === 'Siap Cair' || s.status === 'Revisi' || s.status === 'Ditunda' || s.status === 'Sudah Cair');

            };

            const getSpjDiajukanPerRincian = (uptName, kodeRincian) => {
              return dataSpj
                .filter(s => {
                  const sKode = s.rincian ? s.rincian.split(' ')[0] : '';
                  const normSKode = sKode.replace('5.1.02.01.01.', '').replace(/^0+/, '');
                  const normKode = kodeRincian.replace('5.1.02.01.01.', '').replace(/^0+/, '');
                  return s.sekolah === uptName
                    && (normSKode === normKode || sKode === kodeRincian)
                    && (s.status === 'Menunggu Verifikasi' || s.status === 'Siap Cair' || s.status === 'Revisi' || s.status === 'Ditunda' || s.status === 'Sudah Cair');

                .reduce((acc, s) => acc + (Number(s.nominal) || 0), 0);

            let filtered = rakData.filter(s => {

                matchTw = s[twKey] > 0;

              return matchSearch && matchKec && matchTw;

            const totalDiajukan = filtered.reduce((a, s) => a + getSpjDiajukan(s.namaUpt), 0);

                            .filter(s => s.sekolah === rakDetailSekolah.namaUpt && s.triwulan === `Triwulan ${tw}` && (s.status === 'Menunggu Verifikasi' || s.status === 'Siap Cair' || s.status === 'Sudah Cair'))
                            .reduce((a, s) => a + (Number(s.nominal)||0), 0);

                        {rakDetailSekolah.rincian.length === 0 ? (

                        ) : (
                          <div className="overflow-x-auto rounded-xl border border-gray-200">
                            <table className="w-full text-xs border-collapse">
                              <thead>
                                <tr className="bg-gray-100 text-gray-600">
                                  <th className="p-2.5 text-left font-semibold min-w-[200px]">Rincian Belanja</th>
                                  <th className="p-2.5 text-right font-semibold">Pagu Total</th>
                                  <th className="p-2.5 text-right font-semibold bg-orange-50 text-orange-700">Diajukan</th>
                                  <th className="p-2.5 text-right font-semibold bg-teal-50 text-teal-700">Sisa Pagu</th>
                                  <th className="p-2.5 text-center font-semibold bg-blue-50 text-blue-700" colSpan={3}>TW 1 (Jan-Mar)</th>
                                  <th className="p-2.5 text-center font-semibold bg-yellow-50 text-yellow-700" colSpan={3}>TW 2 (Apr-Jun)</th>
                                  <th className="p-2.5 text-center font-semibold bg-green-50 text-green-700" colSpan={3}>TW 3 (Jul-Sep)</th>
                                  <th className="p-2.5 text-center font-semibold bg-purple-50 text-purple-700" colSpan={3}>TW 4 (Okt-Des)</th>

                                <tr className="bg-gray-50 text-gray-500 text-xs">

                              <div className="p-2 bg-teal-600 text-white rounded-lg"><IconLayers size={18}/></div>
                              <div>
                                <p className="font-bold text-teal-800 flex items-center gap-2 flex-wrap">
                                  {isViewOnly ? gu : editingGuNama === gu ? (
                                    <span className="flex items-center gap-1.5" onClick={(e) => e.stopPropagation()}>
                                      <input type="text" value={editingGuNamaValue} onChange={(e) => setEditingGuNamaValue(e.target.value)}
                                        autoFocus className="text-sm font-bold px-2 py-0.5 rounded-lg border border-teal-300 focus:ring-2 focus:ring-teal-400 focus:outline-none w-48"/>
                                      <button onClick={() => saveEditGuNama(gu, listSpj)} disabled={isLoading}
                                        className="bg-teal-600 hover:bg-teal-700 text-white p-1 rounded-full transition disabled:opacity-50" title="Simpan">
                                        <IconCheckCircle2 size={14}/>
                                      </button>
                                      <button onClick={cancelEditGuNama} disabled={isLoading}
                                        className="bg-gray-200 hover:bg-gray-300 text-gray-600 p-1 rounded-full transition disabled:opacity-50" title="Batal">
                                        <IconXCircle size={14}/>
                                      </button>
                                    </span>
                                  ) : (
                                    <span onClick={(e) => { e.stopPropagation(); startEditGuNama(gu); }}
                                      className="cursor-pointer hover:underline flex items-center gap-1" title="Klik untuk ubah nama GU">
                                      {gu}
                                      <IconEdit size={11} className="opacity-60"/>
                                    </span>
                                  )}
                                  <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-white text-teal-700 border border-teal-200">{listSpj.length} SPJ</span>
                                  {isViewOnly ? (
                                    <span className="text-xs font-medium px-2 py-0.5 rounded-full bg-teal-600 text-white flex items-center gap-1">
                                      <IconClock size={11}/> {listSpj[0]?.tanggalCair || listSpj[0]?.tanggal || '-'}
                                    </span>
                                  ) : editingTglCairGu === gu ? (
                                    <span className="flex items-center gap-1.5" onClick={(e) => e.stopPropagation()}>
                                      <input type="date" value={editingTglCairValue} onChange={(e) => setEditingTglCairValue(e.target.value)}
                                        autoFocus className="text-xs font-medium px-2 py-0.5 rounded-lg border border-teal-300 focus:ring-2 focus:ring-teal-400 focus:outline-none"/>
                                      <button onClick={() => saveEditTglCairGu(gu, listSpj)} disabled={isLoading}
                                        className="bg-teal-600 hover:bg-teal-700 text-white p-1 rounded-full transition disabled:opacity-50" title="Simpan">
                                        <IconCheckCircle2 size={14}/>
                                      </button>
                                      <button onClick={cancelEditTglCairGu} disabled={isLoading}
                                        className="bg-gray-200 hover:bg-gray-300 text-gray-600 p-1 rounded-full transition disabled:opacity-50" title="Batal">
                                        <IconXCircle size={14}/>
                                      </button>
                                    </span>
                                  ) : (
                                    <span onClick={(e) => { e.stopPropagation(); startEditTglCairGu(gu, listSpj); }}
                                      className="text-xs font-medium px-2 py-0.5 rounded-full bg-teal-600 text-white flex items-center gap-1 cursor-pointer hover:bg-teal-700 transition" title="Klik untuk ubah tanggal cair">
                                      <IconClock size={11}/> {listSpj[0]?.tanggalCair || listSpj[0]?.tanggal || '-'}
                                      <IconEdit size={10} className="ml-0.5 opacity-80"/>
                                    </span>
                                  )}
                                </p>
                                <p className="text-xs text-teal-600 mt-0.5">Total: <span className="font-semibold">{formatRupiah(totalGu)}</span></p>
                              </div>
                            </div>
                            <div className="flex items-center gap-2">
                              <button onClick={(e) => { e.stopPropagation(); downloadExcelGu(gu, listSpj); }}
                                className="bg-white text-teal-700 hover:bg-teal-50 border border-teal-200 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center shadow-sm transition">
                                <IconDownload size={13} className="mr-1"/> Excel
                              </button>
                              <IconChevronDown size={18} className={`text-teal-600 transition-transform ${isOpen ? 'rotate-180' : ''}`}/>
                            </div>
                          </div>
                          {isOpen && (
                            <div className="overflow-x-auto">
                              <table className="w-full text-left border-collapse text-sm">
                                <thead>
                                  <tr className="bg-gray-50 border-b border-gray-200 text-xs text-gray-500">
                                    <th className="p-3 font-semibold">ID</th>
                                    <th className="p-3 font-semibold">Instansi & Triwulan</th>
                                    <th className="p-3 font-semibold">Rincian</th>
                                    <th className="p-3 font-semibold text-right">Nominal</th>
                                    {!isViewOnly && <th className="p-3 font-semibold text-right">Aksi</th>}
                                  </tr>
                                </thead>
                                <tbody>
                                  {listSpj.map(spj => {
                                    const adaRiwayat = spj.riwayatRevisi && spj.riwayatRevisi.length > 0;
                                    const riwayatTerbuka = expandedRiwayatCair[spj.id] === true;
                                    return (
                                    <React.Fragment key={spj.id}>
                                    <tr className="border-b border-gray-100 hover:bg-gray-50">
                                      <td className="p-3 font-medium text-gray-700">
                                        {spj.id}
                                        {adaRiwayat && (
                                          <button onClick={() => setExpandedRiwayatCair(prev => ({ ...prev, [spj.id]: !prev[spj.id] }))}
                                            className="mt-1 flex items-center gap-1 text-xs font-medium text-gray-400 hover:text-teal-600 transition">
                                            <IconClock size={11}/> Riwayat
                                            <IconChevronDown size={11} className={`transition-transform ${riwayatTerbuka ? 'rotate-180' : ''}`}/>
                                          </button>
                                        )}
                                      </td>
                                      <td className="p-3">
                                        <div className="font-medium text-gray-800">{spj.sekolah}</div>
                                        <div className="text-xs text-gray-500 flex items-center mt-0.5"><IconMapPin size={11} className="mr-1"/>Kec. {spj.kecamatan} • {spj.triwulan}</div>
                                      </td>
                                      <td className="p-3 text-xs text-gray-600 max-w-[220px] truncate" title={spj.rincian}>{spj.rincian}</td>
                                      <td className="p-3 text-right font-bold text-teal-700">{formatRupiah(spj.nominal)}</td>
                                      {!isViewOnly && (
                                        <td className="p-3 text-right whitespace-nowrap">
                                          <button onClick={() => openQuickStatus(spj)} className="bg-purple-50 text-purple-600 hover:bg-purple-100 px-2 py-1.5 rounded text-xs font-bold inline-flex items-center transition mr-1">
                                            <IconRotateCcw size={13} className="mr-1"/> Ubah Status
                                          </button>
                                          <button onClick={() => handleOpenEdit(spj)} className="bg-orange-50 text-orange-600 hover:bg-orange-100 px-2 py-1.5 rounded text-xs font-bold inline-flex items-center transition mr-1">
                                            <IconEdit size={13} className="mr-1"/> Edit
                                          </button>
                                          <button onClick={() => handleDeleteSpj(spj.id)} className="bg-red-50 text-red-600 hover:bg-red-100 px-2 py-1.5 rounded text-xs font-bold inline-flex items-center transition">
                                            <IconTrash size={13} className="mr-1"/> Hapus
                                          </button>
                                        </td>
                                      )}
                                    </tr>
                                    </React.Fragment>
                                    );
                                  })}
                                </tbody>
                              </table>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          };

          if (!selectedYear) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-blue-50 via-white to-green-50 flex items-center justify-center p-6 font-sans">
                <div className="max-w-md w-full text-center">
                  <div className="mb-6">
                    <h1 className="text-2xl font-extrabold text-blue-700">Sistem SPJ<span className="text-gray-800">BOS</span></h1>
                    <p className="text-sm text-gray-500 mt-1">Dinas Pendidikan • Kabupaten Gresik</p>
                  </div>
                  <div className="bg-white rounded-2xl shadow-lg border border-gray-100 p-6">
                    <p className="text-gray-700 font-semibold mb-4">Pilih tahun anggaran untuk melanjutkan</p>
                    <div className="grid grid-cols-2 gap-3 mb-4">
                      {tahunList.map(thn => (
                        <button key={thn} onClick={() => pilihTahun(thn)}
                          className="bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-700 font-bold text-lg py-4 rounded-xl transition flex flex-col items-center gap-1">
                          <IconTable size={20}/>
                          SPJ BOSDA {thn}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-gray-100 flex font-sans">
              <aside className={`bg-white shadow-md flex-col hidden md:flex z-10 transition-all duration-300 overflow-hidden ${sidebarOpen ? 'w-64' : 'w-0'}`}>
                <div className="p-6 border-b">
                  <h1 className="text-xl font-extrabold text-blue-700">Sistem SPJ<span className="text-gray-800">BOS</span></h1>
                  <p className="text-xs text-gray-500">Dinas Pendidikan</p>
                </div>
                <nav className="flex-1 p-4 space-y-1 overflow-y-auto">
                  <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === 'dashboard' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}><IconDashboard/> <span>Dashboard</span></button>
                  {!isViewOnly && (
                  <button onClick={() => setActiveTab('penerimaan')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === 'penerimaan' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}><IconFileText/> <span>Terima SPJ Baru</span></button>
                  )}
                  <button onClick={() => setActiveTab('verifikasi')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === 'verifikasi' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}><IconClipboardCheck/> <span className="flex-1 text-left">Antrian Verifikasi</span> {stats.menunggu > 0 && <span className="bg-yellow-400 text-yellow-900 text-xs px-2 rounded-full">{stats.menunggu}</span>}</button>
                  <button onClick={() => setActiveTab('siapCair')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === 'siapCair' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}><IconBanknote/> <span className="flex-1 text-left">Antrian Siap Cair</span> {stats.siapCair > 0 && <span className="bg-green-100 text-green-800 text-xs px-2 rounded-full font-bold">{stats.siapCair}</span>}</button>
                  <button onClick={() => setActiveTab('sudahCair')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === 'sudahCair' ? 'bg-teal-50 text-teal-700' : 'text-gray-600 hover:bg-gray-50'}`}>
                    <IconWallet className={activeTab === 'sudahCair' ? 'text-teal-600' : ''}/>
                    <span className="flex-1 text-left">Sudah Cair</span>
                    {stats.sudahCair > 0 && <span className="bg-teal-100 text-teal-800 text-xs px-2 rounded-full font-bold">{stats.sudahCair}</span>}
                  </button>
                  <button onClick={() => setActiveTab('revisi')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === 'revisi' ? 'bg-red-50 text-red-700' : 'text-gray-600 hover:bg-gray-50'}`}>
                    <IconRotateCcw className={activeTab === 'revisi' ? 'text-red-600' : ''}/>
                    <span className="flex-1 text-left">Perlu Revisi</span>
                    {stats.revisi > 0 && <span className="bg-red-100 text-red-800 text-xs px-2 rounded-full font-bold">{stats.revisi}</span>}
                  </button>
                  <button onClick={() => setActiveTab('ditunda')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === 'ditunda' ? 'bg-orange-50 text-orange-700' : 'text-gray-600 hover:bg-gray-50'}`}>
                    <IconPauseCircle className={activeTab === 'ditunda' ? 'text-orange-600' : ''}/>
                    <span className="flex-1 text-left">SPJ Ditunda</span>
                    {stats.ditunda > 0 && <span className="bg-orange-100 text-orange-800 text-xs px-2 rounded-full font-bold">{stats.ditunda}</span>}
                  </button>
                  <button onClick={() => setActiveTab('rakBosda')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === 'rakBosda' ? 'bg-green-50 text-green-700' : 'text-gray-600 hover:bg-gray-50'}`}>
                    <IconTable/> <span className="flex-1 text-left">RAK BOSDA {selectedYear}</span>
                    <span className="bg-green-100 text-green-800 text-xs px-2 rounded-full font-bold">{rakData.length}</span>
                  </button>
                </nav>
              </aside>

              <main className="flex-1 flex flex-col h-screen overflow-hidden">
                <header className="bg-white shadow-sm px-6 py-4 flex flex-wrap justify-between items-center gap-2">
                  <div className="flex items-center gap-3">
                    <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 rounded-lg hover:bg-gray-100 transition text-gray-600">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <span className="font-bold text-gray-700">Panel Verifikator</span>
                  </div>
                </header>

                <div className="flex-1 overflow-auto p-4 md:p-8 relative z-0">
                  {activeTab === 'dashboard' && renderDashboard()}
                  {activeTab === 'penerimaan' && renderPenerimaan()}
                  {activeTab === 'rakBosda' && renderRakBosda()}
                  {activeTab === 'verifikasi' && renderSpjTable('verifikasi')}
                  {activeTab === 'siapCair' && renderSpjTable('siapCair')}
                  {activeTab === 'sudahCair' && renderSudahCair()}
                  {activeTab === 'revisi' && renderSpjTable('revisi')}
                  {activeTab === 'ditunda' && renderSpjTable('ditunda')}
                </div>
              </main>
            </div>
          );
        }

        const rootElement = document.getElementById("root");
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App/>);
    </script>
</body>
</html>
