<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem SPJ BOS - Dinas Pendidikan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DATA RAK ---
        const RAK_DATA = {
            "1": { "5.1.02.01.01.0024": { "t": 5000000, "1": 2000000, "2": 3000000 } },
            "16": { "5.1.02.01.01.0029": { "t": 10000000, "1": 5000000, "2": 5000000 } }
        };

        // --- FUNGSI PEMBANTU ---
        function getSchoolNumber(name) {
            const m = name.match(/\b(\d+)\b/);
            return m ? m[1] : null;
        }

        function getPaguInfo(sekolah, rincian, triwulan) {
            const num = getSchoolNumber(sekolah);
            if (!num || !RAK_DATA[num]) return null;
            const rData = RAK_DATA[num];
            const kode = rincian.split(' ')[0];
            if (!rData[kode]) return null;
            const tw = triwulan.replace('Triwulan ', '');
            return { total: rData[kode]['t'], triwulan: rData[kode][tw] || 0, kode: kode };
        }

        const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);

        // --- KOMPONEN PENDUKUNG ---
        const IconClipboardCheck = ({size=20, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>;
        const IconInfo = ({size=20, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;

        const PaguInfoCard = ({ sekolah, rincian, triwulan, nominalInput, dataSpj }) => {
            if (!sekolah || !rincian || !triwulan) return null;
            const paguInfo = getPaguInfo(sekolah, rincian, triwulan);
            if (!paguInfo) return <div className="mt-2 p-3 bg-gray-50 border border-gray-200 rounded-lg text-xs italic text-gray-500">Data RAK tidak ditemukan.</div>;

            const kodeBelanja = rincian.split(' ')[0];
            const sudahDiajukan = dataSpj.filter(s => getSchoolNumber(s.sekolah) === getSchoolNumber(sekolah) && s.rincian.includes(kodeBelanja) && s.triwulan === triwulan).reduce((acc, s) => acc + s.nominal, 0);

            const sisaPaguTw = paguInfo.triwulan - sudahDiajukan;
            const isOver = Number(nominalInput) > sisaPaguTw;

            return (
                <div className={`mt-3 p-3 border rounded-lg ${isOver ? 'bg-red-50 border-red-200 text-red-700' : 'bg-green-50 border-green-200 text-green-700'}`}>
                    <div className="flex items-center gap-2 text-xs font-bold mb-1"><IconInfo size={14}/> INFO PAGU {triwulan.toUpperCase()}</div>
                    <div className="text-xs">Sisa Pagu: <span className="font-bold">{formatRupiah(Math.max(0, sisaPaguTw))}</span></div>
                    {isOver && <div className="text-[10px] mt-1 font-bold">WARNING: Nominal melebihi sisa pagu!</div>}
                </div>
            );
        };

        function App() {
            const [dataSpj, setDataSpj] = useState([
                { id: 'SPJ-001', sekolah: 'UPT SDN 1 GRESIK', rincian: '5.1.02.01.01.0024 Belanja Alat Tulis Kantor', nominal: 500000, triwulan: 'Triwulan 1', status: 'Menunggu' }
            ]);
            const [addForm, setAddForm] = useState({ sekolah: 'UPT SDN 1 GRESIK', rincian: '5.1.02.01.01.0024 Belanja Alat Tulis Kantor', nominal: '', triwulan: 'Triwulan 1' });

            return (
                <div className="p-8 max-w-xl mx-auto bg-white shadow-lg rounded-xl">
                    <h1 className="text-xl font-bold mb-4">Sistem Input SPJ</h1>
                    <div className="space-y-3">
                        <select className="w-full p-2 border rounded" onChange={e => setAddForm({...addForm, sekolah: e.target.value})}>
                            <option>UPT SDN 1 GRESIK</option>
                            <option>UPT SDN 16 GRESIK</option>
                        </select>
                        <input className="w-full p-2 border rounded" placeholder="Nominal" type="number" onChange={e => setAddForm({...addForm, nominal: e.target.value})} />
                        <select className="w-full p-2 border rounded" onChange={e => setAddForm({...addForm, triwulan: e.target.value})}>
                            <option>Triwulan 1</option>
                            <option>Triwulan 2</option>
                        </select>
                    </div>

                    <PaguInfoCard 
                        sekolah={addForm.sekolah} 
                        rincian={addForm.rincian} 
                        triwulan={addForm.triwulan} 
                        nominalInput={addForm.nominal} 
                        dataSpj={dataSpj} 
                    />
                    
                    <button className="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg font-bold">Simpan SPJ</button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
